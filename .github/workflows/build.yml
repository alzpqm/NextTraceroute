name: 手動簽署建置

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v7

      - name: 設定 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: 設定 Android SDK
        uses: android-actions/setup-android@v4

      - name: 安裝 Android 37 平台
        run: sdkmanager --channel=3 "platforms;android-37"

      - name: 準備簽署金鑰
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE_64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: 測試並建置正式版
        env:
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: bash gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease

      - name: 執行隱私掃描
        run: scripts/privacy-scan.sh --artifacts

      - name: 整理建置產物
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/NextTraceroute-v0.2.2.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/NextTraceroute-v0.2.2.aab
          cd dist
          sha256sum NextTraceroute-v0.2.2.apk NextTraceroute-v0.2.2.aab > SHA256SUMS.txt

      - name: 上傳暫存產物
        uses: actions/upload-artifact@v7
        with:
          name: NextTraceroute-v0.2.2-signed
          path: dist/
          retention-days: 1
          compression-level: 0
